databases:
  - name: smart-campus-postgres
    databaseName: campussafe
    user: campussafe
    plan: free
    region: singapore

services:
  - type: web
    name: smart-campus-api-java
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-campus-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://smart-campus-frontend-iota.vercel.app
      - key: UPLOAD_DIR
        value: uploads
