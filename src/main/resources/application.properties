spring.config.import=optional:file:.env[.properties]
server.port=${PORT:5000}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/campussafe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:campussafe}
spring.datasource.password=${DB_PASSWORD:campussafe-local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.jwt.secret=${JWT_SECRET:local-development-only-secret-change-this-value}
app.client-url=${CLIENT_URL:https://smart-campus-frontend-iota.vercel.app}
app.upload-dir=${UPLOAD_DIR:uploads}
